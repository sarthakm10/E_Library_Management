server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 6m;

    # API and cover images come from the Spring Boot container.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /book_inventory/ {
        proxy_pass http://api:8080;
    }

    # Hashed build assets can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: every other path loads index.html and React Router takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
