server:
  port: 8080

spring:
  application:
    name: elibrary-api
  # Local secrets (DB_USERNAME, DB_PASSWORD, APP_JWT_SECRET...) from server/.env, if present. Not committed.
  config:
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  # MySQL database. Override with environment variables DB_URL, DB_USERNAME, DB_PASSWORD.
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/elibraryDB?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  # Creates the tables (if missing) and a starter admin account on every start. Safe to re-run.
  sql:
    init:
      mode: always
      schema-locations: classpath:db/mysql/schema.sql

app:
  jwt:
    # Set APP_JWT_SECRET to a long random string (32+ characters) outside local development.
    secret: ${APP_JWT_SECRET:dev-only-secret-change-me-please-0123456789abcdef}
    ttl-hours: 12
  # Folder holding book cover images (relative to where the API is started; server/ by default).
  upload-dir: ${APP_UPLOAD_DIR:book_inventory}
  # Browser origins allowed to call the API (the Vite dev server by default).
  cors-origins: ${APP_CORS_ORIGINS:http://localhost:5173}
  default-loan-days: 14
  fine-per-day: ${APP_FINE_PER_DAY:5}
  max-renewals: ${APP_MAX_RENEWALS:2}
  hold-pickup-days: ${APP_HOLD_PICKUP_DAYS:3}
  # On an empty database: load the 300-book catalog, then sample members, loans, history and holds.
  seed-sample-data: ${APP_SEED_SAMPLE_DATA:true}

---
# SQL Server profile: the original legacy elibraryDB on SQL Server Express. Run with --spring.profiles.active=sqlserver
spring:
  config:
    activate:
      on-profile: sqlserver
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost\SQLEXPRESS;databaseName=elibraryDB;encrypt=true;trustServerCertificate=true}
  sql:
    init:
      mode: never

---
# Demo profile: in-memory H2 database with sample data.
spring:
  config:
    activate:
      on-profile: demo
  datasource:
    url: jdbc:h2:mem:elibrary;MODE=MSSQLServer;DATABASE_TO_UPPER=false;CASE_INSENSITIVE_IDENTIFIERS=true;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/demo/schema.sql
      data-locations: classpath:db/demo/data.sql
